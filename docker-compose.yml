# GEMINI_API_KEY below is read from the .env file (loaded automatically)
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - property-triage
    depends_on:
      - rag-service
      - guardrails-service
      - image-analyser
      - langgraph-agent

  rag-service:
    build: ./services/rag-service
    container_name: rag-service
    ports:
      - "8001:8001"
    volumes:
      # GGUF model - not baked into the image, mounted read-only from host.
      - ./services/rag-service/models:/app/models:ro
      # Named volume: on first run, Docker copies the build-time-seeded
      # /app/chroma_db from the image into this volume, then persists it
      # across container restarts/recreations independent of image rebuilds.
      - rag_chroma_data:/app/chroma_db
    networks:
      - property-triage

  guardrails-service:
    build: ./services/guardrails-service
    container_name: guardrails-service
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - property-triage

  image-analyser:
    build: ./services/image-analyser
    container_name: image-analyser
    ports:
      - "8003:8003"
    networks:
      - property-triage

  langgraph-agent:
    build: ./services/langgraph-agent
    container_name: langgraph-agent
    ports:
      - "8004:8004"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - property-triage

networks:
  property-triage:
    driver: bridge

volumes:
  # External: reuses the manual n8n container's existing volume,
  # so workflows/credentials carry over.
  n8n_data:
    external: true
  rag_chroma_data:
